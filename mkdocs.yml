site_name: RBedu
site_url: https://927-927.github.io/
repo_url: https://github.com/927-927/927-927.github.io
repo_name: 927-927/927-927.github.io

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Hardware:
      - hardware/index.md
  - Electronics:
      - electronics/index.md
      - Power wiring: electronics/power-wiring.md
      - Signal wiring: electronics/signal-wiring.md
      - Tools: electronics/tools.md
      - Connectors: electronics/connectors.md
      - Wire terminals: electronics/wire-terminals.md
  - Software:
      - software/index.md
