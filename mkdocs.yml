site_name: RBedu
site_url: https://927-927.github.io/
repo_url: https://github.com/927-927/927-927.github.io
repo_name: 927-927/927-927.github.io

# Working notes, not pages
exclude_docs: |
  Team_analysis/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # English stays at /, Chinese is built at /zh/. A page's Chinese version sits
  # next to it with a .zh suffix (index.md -> index.zh.md); pages without one
  # show the English text on the Chinese site.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
          # Chinese titles for the nav entries, keyed by their English title.
          # Terms follow translation-glossary.md.
          nav_translations:
            Home: 首页
            Hardware: 硬件
            Common devices: 常用设备
            Components: 零部件
            Electronics: 电控
            Power wiring: 电源接线
            Signal wiring: 信号接线
            Tools: 工具
            Connectors: 连接器
            Wire terminals: 线端端子
            Troubleshooting: 故障排查
            Software: 软件
            Java basics: Java 基础
            Command-based skeleton: 基于命令的基本结构
            Time-based to command-based: 从基于时间到基于命令
            Complex command-based: 进阶基于命令编程
            Command-based styles: 各队的基于命令风格
            Team 2910: 2910 队
            Team 1678: 1678 队
            Team 8214: 8214 队

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/code-window.js
  - javascripts/can-sim.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Hardware:
      - hardware/index.md
      - CAD: hardware/cad.md
      - Common devices: hardware/devices.md
      - Components: hardware/components.md
  - Electronics:
      - electronics/index.md
      - Power wiring: electronics/power-wiring.md
      - Signal wiring: electronics/signal-wiring.md
      - Tools: electronics/tools.md
      - Connectors: electronics/connectors.md
      - Wire terminals: electronics/wire-terminals.md
      - Troubleshooting: electronics/troubleshooting.md
  - Software:
      - software/index.md
      - Java basics: software/java-basics.md
      - Command-based skeleton: software/command-based-skeleton.md
      - Time-based to command-based: software/time-based-to-command-based.md
      - Complex command-based: software/complex-command-based.md
      # Teams without their own page yet are headings on the index page,
      # so link to them by URL
      - Command-based styles:
          - software/command-based-styles/index.md
          - Team 2910: software/command-based-styles/team-2910.md
          - Team 1678: software/command-based-styles/team-1678.md
          - Team 8214: /software/command-based-styles/#team-8214
